context:
  name: essspectroscopy
  version: "26.10.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/essspectroscopy-${{ version }}.tar.gz
  sha256: 020da57e35a75dcd688a778977a0e39c10a2e0b729356090f8ef2d6f8acf1d21

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - dask >=2022.1.0
    - python-graphviz >=0.20
    - essreduce >=26.8.0
    - pandas >=2.1.2
    - tof >=25.11.0

tests:
  - python:
      imports:
        - ess.spectroscopy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Spectroscopy data reduction for the European Spallation Source
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/ess/tree/main/packages/essspectroscopy
  homepage: https://scipp.github.io/ess/spectroscopy/

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/scipp
